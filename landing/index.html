<body>
  <div id="root"></div>
  <!-- For crawlers and readers that don't run JavaScript, which see an empty #root otherwise.
       Mirrors the copy in app/app.jsx; change both together. -->
  <noscript>
    <main class="noscript wrap">
      <h1 class="h1">Every strike, analyzed.</h1>
      <p class="lede">Feed it fight video. Fightlytics tracks both fighters, reads the rounds and logs strikes by type, target and fighter.</p>

      <h2 class="h3">Two fighters, 17 points each.</h2>
      <p class="body">A pose model finds both fighters in every frame and places 17 keypoints on each. The referee is filtered out.</p>
      <h2 class="h3">Red corner, blue corner, every frame.</h2>
      <p class="body">Corners are read from glove tape and torso colour, not from which side of the cage a fighter is on.</p>
      <h2 class="h3">Read 1.2 seconds, name the strike.</h2>
      <p class="body">The strike model reads both skeletons across a 1.2 second window, then names the shot (jab, cross, hook, uppercut, kick or knee) and where it was aimed (head, body or leg).</p>
      <h2 class="h3">Every strike, one click from its frame.</h2>
      <p class="body">Each strike lands on the fight timeline with its fighter and frame number. Click one and the video jumps there.</p>

      <h2 class="h3">A whole fight on one line.</h2>
      <p class="body">Rounds come from the broadcast scoreboard, and walkouts, breaks and replays are left out of the count.</p>

      <h2 class="h3">Trained only on strikes a person confirmed.</h2>
      <ul class="body">
        <li><strong>Label:</strong> labellers mark each strike on the frame it happens, with the fighter, type and target.</li>
        <li><strong>Verify:</strong> a QA pass accepts or rejects every label. Only accepted strikes are used for training.</li>
        <li><strong>Measure:</strong> each new model is scored on hand-labelled fights it never trained on.</li>
      </ul>

      <h2 class="h3">Live broadcast feeds, coming later.</h2>
      <p class="body">Today Fightlytics works on recorded fights. A version that runs on a live feed, for broadcasters, is on the way.</p>

      <p class="body">Fightlytics is invite-only while it&rsquo;s in early access. Turn on JavaScript to join the waitlist. Already invited? <a href="https://app-fightlytics.duckdns.org">Sign in</a>.</p>
    </main>
  </noscript>
